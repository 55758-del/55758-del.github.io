<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My First website</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<h1>George Harvey Photography Portfolio</h1>
<p>All my photos</p>
</header>

<nav>
<ul>
<li><a href="#home" onclick="showPage('home')">Home</a></li>
<li class="dropdown">
  <a href="javascript:void(0)" class="dropbtn">Photos</a>
  <div class="dropdown-content">
    <a href="#turkey" onclick="showPage('Turkey')">Turkey</a>
    <a href="#iOW" onclick="showPage('iOW')">Isle of White</a>
  </div>
</li>
<li><a href="#about" onclick="showPage('about')">About</a></li>
<li><a href="#contact" onclick="showPage('contact')">Contact</a></li>
</ul>
</nav>

<main id="content">
<h2>Welcome!</h2>
<footerP>Click the links above to see different content here.</footerP>
</main>

<footer>
<p>&copy; 2025 - George Harvey - html project</p>
<button id="mode-toggle">🌙</button>
</footer>

<div id="lightbox">
  <span id="close-lightbox">&times;</span>

  <div class="image-container">
    <button id="prev-btn">&#10094;</button>

    <img id="lightbox-img" src="" alt="">

    <button id="next-btn">&#10095;</button>

    <div class="watermark">© George Harvey Photography</div>
  </div>
</div>
  
<script>
const content = document.getElementById('content');
const toggleButton = document.getElementById('mode-toggle');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');
const closeLightbox = document.getElementById('close-lightbox');
let currentImages = [];
let currentIndex = 0;
  
function showPage(page) {
  if (page === 'home') {
    content.innerHTML = `
    <h2>Home</h2>
    <p>Welcome to the homepage! Here you can find the different sections that I have sorted my photoshoots into.</p>`;
  } 
  else if (page === 'about') {
    content.innerHTML = `
    <h2>About</h2>
    <p>This website was made to store all my photography work.</p>`;
  } 
  else if (page === 'contact') {
    content.innerHTML = `
    <h2>Contact</h2>
    <p>You can reach me at <a href='mailto:gharveywmail@gmail.com'>gharveywmail@gmail.com</a> if you have any questions or are interested in purchasing the photos.</p>`;
  }
  else if (page === 'iOW') {
    content.innerHTML = `
    <h2>Isle of White</h2>
    <p>These are some of the photos I took in the Isle of White.</p>
    <section id="gallery">
      <h3>Photo Gallery</h3>
      <div class="gallery" id="gallery-container"></div>
    </section>
    `;
    fetch('Photos/Isle of White/images.json')
      .then(response => response.json())
      .then(data => {
        const gallery = document.getElementById('gallery-container');
        currentImages = [];
        data.images.forEach((imgName, index) => {
          const img = document.createElement('img');
          img.src = 'Photos/Isle of White/' + imgName;
          img.alt = imgName;
          currentImages.push(img.src);
          img.addEventListener('click', () => {
            openLightbox(index);
          });
          gallery.appendChild(img);
        });
      })
      .catch(error => {
        console.error('Error loading images:', error);
        document.getElementById('gallery-container').innerHTML = '<p>Could not load images.</p>';
      });
  }
  else if (page === 'Turkey') {
    content.innerHTML = `
    <h2>Turkey</h2>
    <p>These are some of the photos I took in Turkey.</p>
    <section id="gallery">
      <h3>Photo Gallery</h3>
      <div class="gallery" id="gallery-container"></div>
    </section>
    `;
    fetch('Photos/Best_Photos/images.json')
      .then(response => response.json())
      .then(data => {
        const gallery = document.getElementById('gallery-container');
        currentImages = [];
        data.images.forEach((imgName, index) => {
          const img = document.createElement('img');
          img.src = 'Photos/Best_Photos/' + imgName;
          img.alt = imgName;
          currentImages.push(img.src);
          img.addEventListener('click', () => {
            openLightbox(index);
          });
          gallery.appendChild(img);
        });
      })
      .catch(error => {
        console.error('Error loading images:', error);
        document.getElementById('gallery-container').innerHTML = '<p>Could not load images.</p>';
      });
  }
}

function setDarkMode(enabled) {
  if (enabled) {
    document.body.classList.add('dark-mode');
    toggleButton.textContent = '☀️';
    localStorage.setItem('darkMode', 'true');
  } else {
    document.body.classList.remove('dark-mode');
    toggleButton.textContent = '🌙';
    localStorage.setItem('darkMode', 'false');
  }
}

toggleButton.addEventListener('click', () => {
  const darkEnabled = document.body.classList.contains('dark-mode');
  setDarkMode(!darkEnabled);
});

window.addEventListener('DOMContentLoaded', () => {
  const savedMode = localStorage.getItem('darkMode') === 'true';
  setDarkMode(savedMode);
});

closeLightbox.addEventListener('click', () => {
  lightbox.style.display = 'none';
});

lightbox.addEventListener('click', (e) => {
  if (e.target === lightbox) {
    lightbox.style.display = 'none';
  }
});

lightboxImg.addEventListener('contextmenu', e => {
  e.preventDefault();
});

document.addEventListener('contextmenu', (e) => {
  if (e.target.tagName === 'IMG') {
    e.preventDefault();
  }
});

document.addEventListener('dragstart', (e) => {
  if (e.target.tagName === 'IMG') {
    e.preventDefault();
  }
});

function openLightbox(index) {
  currentIndex = index;
  lightboxImg.src = currentImages[currentIndex];
  lightbox.style.display = 'flex';
}

function showNext() {
  currentIndex = (currentIndex + 1) % currentImages.length;
  lightboxImg.src = currentImages[currentIndex];
}

function showPrev() {
  currentIndex = (currentIndex - 1 + currentImages.length) % currentImages.length;
  lightboxImg.src = currentImages[currentIndex];
}

document.getElementById('next-btn').addEventListener('click', showNext);
document.getElementById('prev-btn').addEventListener('click', showPrev);

</script>

</body>
</html>
